name: CI

# The workflow name MUST stay "CI" — iteration-trigger.yml keys its
# `workflow_run` filter on it. Renaming this breaks the Ralph inner loop.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit (lint, format, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  android:
    name: Android (Wear OS) - lint, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Single source of truth: check-all.sh runs ktlint + detekt + unit tests +
      # coverage via Gradle. Until Epic 1 lands the Gradle project, the script
      # no-ops with a clear message and exits 0, keeping CI green.
      - name: Run all checks
        run: bash scripts/check-all.sh

      # TODO(Epic 1): once the Gradle Wear module exists, assemble the debug APK
      # and (optionally) run instrumented Compose UI tests on a Wear emulator.
      # - name: Assemble debug APK
      #   run: ./gradlew :app:assembleDebug
